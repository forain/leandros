[package]
name = "usb"
version.workspace = true
edition.workspace = true

[dependencies]
leandros-lib = { path = "../../lib" }
ipc     = { path = "../../ipc" }
mm      = { path = "../../mm" }
kmod-abi = { path = "../../lib/kmod-abi" }
bitflags.workspace = true
spin.workspace = true

[features]
# CONFIG_USB_VIDEO_CLASS=m: the uvc class driver is left out of the kernel (modules/uvc is built instead).
uvc-module = []
# CONFIG_USB_HID=m: boot HID is left to modules/usb-hid (the enumerator hands the function to the class registry).
hid-module = []
# CONFIG_USB_STORAGE=m: the enumerator leaves bulk-only interfaces to the usb-storage module (class registry).
msc-module = []
