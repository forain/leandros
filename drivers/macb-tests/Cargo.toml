# Host unit tests for drivers/src/macb_hw.rs (Cadence GEM: RX/TX
# descriptor rings, MDIO/PHY autoneg, link -> NCFGR, DTB lookup) of the
# Raspberry Pi 5 Ethernet driver. Its own workspace so it builds for the host, outside the
# no_std kernel workspace:
#
#   cd drivers/macb-tests && cargo test --target aarch64-apple-darwin
#   (the repo's .cargo config defaults to the kernel target; name the host's)
[package]
name = "macb-tests"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "src/lib.rs"
