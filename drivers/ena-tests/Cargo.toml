# Host unit tests for drivers/src/ena_hw.rs (the Amazon ENA driver core) run
# against a Rust mock ENA device: register file, admin SQ/CQ processor, AENQ
# generator, TX/RX ring loopback over simulated DMA memory, readless-MMIO
# mode. Its own workspace so it builds for the host, outside the no_std kernel
# workspace:
#
#   cd drivers/ena-tests && cargo test --target aarch64-apple-darwin
#   (the repo's .cargo config defaults to the kernel target; name the host's)
[package]
name = "ena-tests"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "src/lib.rs"
