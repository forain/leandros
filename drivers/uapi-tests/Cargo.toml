# Host unit tests for the GPU-UAPI logic that does not need hardware:
# drivers/src/syncobj_core.rs (binary + timeline DRM sync objects) and
# drivers/nvidia/src/uapi_vm.rs (nouveau VM_BIND range bookkeeping). Its own
# workspace so it builds for the host, outside the no_std kernel workspace:
#
#   cd drivers/uapi-tests && cargo test --target "$(rustc -vV | sed -n "s/host: //p")"
#
# (the repository .cargo/config.toml defaults the target to the kernel one).
[package]
name = "uapi-tests"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "src/lib.rs"
