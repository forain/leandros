[package]
name = "drivers"
version.workspace = true
edition.workspace = true

[features]
# Select the sdhci SD-card driver as drivers::blkdev instead of virtio_blk.
# rpi5 targets real BCM2712 hardware; raspi4b targets QEMU's -M raspi4b
# generic-sdhci model (used only as a testable stepping stone — see
# drivers/src/sdhci.rs's top-of-file comment).
rpi5 = []
raspi4b = []

[dependencies]
leandros-lib = { path = "../lib" }
ipc = { path = "../ipc" }
mm = { path = "../mm" }
boot = { path = "../boot" }
evdev-server = { path = "../servers/evdev" }
# For `vt::active()` only: DRM master is scoped to the VT it was granted on, so
# the master gate has to know which console is on screen. No cycle — `tty-server`
# depends on ipc/sched/spin and reaches this crate only through the `fb_vt_*`
# `#[no_mangle]` seam — and `evdev-server` already pulls it in transitively.
tty-server = { path = "../servers/tty" }
sched = { path = "../sched" }
spin.workspace = true
