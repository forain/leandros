[package]
name = "drivers"
version.workspace = true
edition.workspace = true

[features]
# Select the sdhci SD-card driver as drivers::blkdev instead of virtio_blk.
# rpi5 targets real BCM2712 hardware; raspi4b targets QEMU's -M raspi4b
# generic-sdhci model (used only as a testable stepping stone — see
# drivers/src/sdhci.rs's top-of-file comment).
rpi5 = []
raspi4b = []
# Verbose xHCI tracing and the boot-time bulk-only-transport self-test on
# every enumerated USB mass-storage interface (drivers/src/usb_hcd.rs).
usb-debug = []
# CONFIG_USB_HID=m: modules/usb-hid owns boot HID; the built-in glue (usb_hid.rs) only runs the USB tick hooks.
usb-hid-module = ["usb/hid-module"]
# CONFIG_USB_STORAGE=y gates drivers/src/usb_storage.rs; =m / =n use the stub.
drv-usb-storage = []
usb-storage-module = ["usb/msc-module"]
# Kconfig CONFIG_I915 / CONFIG_VIRTIO_GPU / CONFIG_V3D (kernel features drv-*).
# Off: i915 is replaced by drivers/src/i915_stub.rs; the others skip their probe.
i915 = []
virtio-gpu = []
v3d = []
# Scanout, KMS plane and DRM-side V3D plumbing: on for V3D=y and V3D=m, off for V3D=n.
v3d-core = []
# kmod L1c: misc driver gates (CONFIG_* -> drv-*). Off = stub module, same API.
drv-virtio-rng = []
drv-hda = []
drv-lapinv = []
drv-i2c-hid = []
drv-nvme = []
drv-sdhci = []
drv-virtio-blk = []
drv-virtio-keyboard = []

# Kconfig-gated NIC drivers (CONFIG_FOO -> kernel feature drv-foo -> drivers/foo).
# Off: the module is replaced by a small stub under src/stubs/ or compiled out.
e1000e = []
r8169 = []
ena = []
macb = []
virtio-net = []
virtio-snd = []
# CONFIG_HDMI_AUDIO (Pi 5): gates drivers/src/hdmi_audio/ hardware code; off = stub (probe() = Err).
hdmi-audio = []
# Hidden CONFIG_WIFI_STACK: shared 802.11 code (frames, crypto, HT, manager).
wifi-stack = []
iwlwifi = ["wifi-stack"]
wifi-sim = ["wifi-stack", "virtio-net"]
brcmf = ["wifi-stack"]

[dependencies]
leandros-lib = { path = "../lib" }
ipc = { path = "../ipc" }
mm = { path = "../mm" }
boot = { path = "../boot" }
evdev-server = { path = "../servers/evdev" }
# For `vt::active()` only: DRM master is scoped to the VT it was granted on, so
# the master gate has to know which console is on screen. No cycle — `tty-server`
# depends on ipc/sched/spin and reaches this crate only through the `fb_vt_*`
# `#[no_mangle]` seam — and `evdev-server` already pulls it in transitively.
tty-server = { path = "../servers/tty" }
sched = { path = "../sched" }
usb = { path = "usb" }
# The /dev/netctl contract (types shared with servers/net and userland).
netctl-abi = { path = "../lib/netctl-abi" }
spin.workspace = true
