# Host unit tests for drivers/src/partscan.rs (the partition-table parser the
# kernel block registry uses). Its own workspace so it builds for the host,
# outside the no_std kernel workspace:
#
#   cd drivers/partscan-tests && cargo test
[package]
name = "partscan-tests"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "src/lib.rs"
