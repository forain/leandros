# Host unit tests for the Pi 5 HDMI probe decoders (drivers/src/hdmi_probe/decode.rs).
# Its own workspace so it builds for the host, outside the no_std kernel workspace:
#
#   cd drivers/hdmi-probe-tests && cargo test --target aarch64-apple-darwin
[package]
name = "hdmi-probe-tests"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "src/lib.rs"
