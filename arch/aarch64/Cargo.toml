[package]
name = "arch-aarch64"
version.workspace = true
edition.workspace = true

[features]
# Target Raspberry Pi 5 (BCM2712 + RP1).
# Selects correct UART/GIC base addresses and UARTCLK divisors for RPi 5.
# Without this flag the defaults target QEMU -machine virt.
rpi5 = []
# Target QEMU's -M raspi4b machine (BCM2711). Testable stepping stone for
# the sdhci driver (see drivers/src/sdhci.rs) — not a hardware target.
raspi4b = []

[dependencies]
boot    = { path = "../../boot" }
leandros-lib = { path = "../../lib" }
mm      = { path = "../../mm" }
sched   = { path = "../../sched" }
evdev-server = { path = "../../servers/evdev" }
drivers = { path = "../../drivers" }
bitflags.workspace = true
