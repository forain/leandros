# Host unit tests for the kvm crate. Its own workspace so it builds for the
# host, outside the no_std kernel workspace:
#
#   cd kvm/host-tests && cargo test --release
[package]
name = "kvm-host-tests"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
kvm = { path = ".." }

[lib]
path = "src/lib.rs"
