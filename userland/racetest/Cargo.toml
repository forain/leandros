[package]
name = "racetest"
version.workspace = true
edition.workspace = true

[[bin]]
name = "racetest"
path = "src/main.rs"

[dependencies]
# No leandros-libc! We link directly against librelibc.a, the same way
# pthreadtest/timertest/sigtest/polltest/forktest do: the suite needs real
# fork()/pthread/nanosleep/clock_gettime from the libc userspace, plus a
# handful of raw Leandros IPC syscalls issued via local inline asm.
