[workspace]
resolver = "2"
members = ["libc", "hello", "shell", "init", "login", "greeter-launch", "aplay", "memtest", "vfstest", "f2fstest", "tput", "pthreadtest", "timertest", "sigtest", "polltest", "forktest", "racetest", "mount", "umount", "fstab", "lsblk", "lspci", "lsusb", "ping", "waittest", "sigchldtest", "xattr-util", "scmtest", "epolltest", "wakepolltest", "idletest", "drmsmoke", "evtest2", "venustest"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
strip = false
