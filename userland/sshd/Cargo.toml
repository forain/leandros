[workspace]

[package]
name = "sshd"
version = "0.1.0"
edition = "2021"
description = "LeandrOS SSH server built on russh: password (/etc/shadow) and public-key auth, pty shells, exec, sftp"

# Standalone, outside the userland workspace (std + musl, like userland/claude-run).
# Installed as /usr/sbin/sshd and started by init at boot.
[[bin]]
name = "sshd"
path = "src/main.rs"

[dependencies]
# ring instead of the default aws-lc-rs: ring's C/asm builds through the zig
# cc wrapper like coreutils' C does; aws-lc-rs would need cmake and a C++
# cross toolchain.
russh = { version = "0.64.1", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "process", "sync", "time", "macros", "signal"] }
libc = "0.2"
sha2 = "0.10"

[profile.release]
panic = "abort"
opt-level = 2
