[workspace]
resolver = "2"
members = [
    "kernel",
    "mm",
    "sched",
    "ipc",
    "capability",
    "elf",
    "servers/vfs",
    "servers/net",
    "servers/tty",
    "servers/libc-shim",
    "servers/drm",
    "servers/pipewire",
    "servers/f2fs",
    "servers/xattr",
    "drivers",
    "drivers/usb",
    "drivers/wifi",
    "boot",
    "lib",
    "lib/netctl-abi",
    "lib/bt-host",
    "lib/kmod-abi",
    "lib/kmod-elf",
    "lib/kmod-rt",
    "modules/hello",
    "modules/virtio-rng",
    "modules/e1000e",
    "modules/iwlwifi",
    "modules/nvme",
    "modules/virtio-blk",
    "modules/virtio-keyboard",
    "modules/virtio-net",
    "modules/virtio-snd",
    "modules/hda",
    "modules/uvc",
    "scripts/kmod/fixtures/badsym",
    "scripts/kmod/fixtures/baddep",
    "scripts/kmod/fixtures/badsimd",
    "lib/kmod-kapi",
    "arch/x86_64",
    "arch/aarch64",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
authors = []

[workspace.dependencies]
bitflags = "2"
spin = "0.9"

[profile.dev]
panic = "abort"


[profile.release]
panic = "abort"
lto = true
opt-level = "s"

[patch.crates-io]
# smoltcp 0.11.0 with TCP loss-recovery fixes (RTO restart on ACK, 200 ms RTO
# floor, one-segment fast retransmit + NewReno), see
# servers/net/vendor/smoltcp/LEANDROS-PATCH.md.
smoltcp = { path = "servers/net/vendor/smoltcp" }
# spin 0.9.8 with a held-lock accounting hook, see vendor/spin/LEANDROS-PATCH.md.
spin = { path = "vendor/spin" }
