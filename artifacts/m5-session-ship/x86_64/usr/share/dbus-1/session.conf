<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Minimal session bus configuration for busd 0.5.0 on LeandrOS.

  busd unconditionally reads a config file (default
  /usr/share/dbus-1/session.conf, see src/bin/busd.rs) even though most of
  the D-Bus spec's config surface (policy enforcement, <fork>, <user>,
  <servicehelper>, activation via .service files) isn't implemented yet
  (busd is alpha — see AGENTS.md "Architecture"). So this file only
  contains elements busd's config/xml.rs actually parses and that make
  sense for us:

    - <type>session</type>   — informational (sets $DBUS_STARTER_BUS_TYPE
      for activated clients; we don't do activation yet, harmless either
      way).
    - <auth>EXTERNAL</auth>  — matches spec intent. NOTE: for a unix-socket
      listener busd's bus::Bus::for_address() hardcodes
      AuthMechanism::External regardless of this element (auth_mechanism is
      derived from the transport kind, not from Config::auth, which the
      broker doesn't currently thread through) — this line is documentation
      of intent, not load-bearing today.
    - <listen> — a default listen address. In practice
      dbus-run-session always passes an explicit `--address`, which takes
      precedence over this (see src/bin/busd.rs), so this value only
      matters if busd is invoked directly without -a/--address.

  Deliberately OMITTED:
    - <policy> — busd has no groups/users database story we can rely on
      (LeandrOS is single-user/root-only for this bring-up), and the task
      brief says ship no policy modules we don't have. Everything is
      allowed by default when no policy denies it.
    - <servicedir>/<standard_session_servicedirs> — no .service-file
      activation support to point at yet.
    - <fork>, <pidfile>, <user>, <syslog>, <keep_umask> — daemonizing,
      privilege-dropping and syslog are not part of our LeandrOS session
      bring-up (busd is launched and supervised directly by
      dbus-run-session, foreground, as root).
-->
<busconfig>
  <type>session</type>
  <auth>EXTERNAL</auth>
  <listen>unix:path=/run/user/0/bus</listen>
</busconfig>
