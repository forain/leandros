<!doctype html><html><head><meta charset=utf-8><title>ffv</title>
<style>body{margin:0;background:#123;color:#fff;font:20px sans-serif}#c{position:fixed;top:0;right:0;background:#000;padding:6px;font-size:32px}.r{height:120px;border-bottom:1px solid #456}</style></head>
<body><div id=c>0</div><video id=v src="v720.webm" autoplay width=960 height=540></video>
<div id=rows></div>
<script>
let n=0,c=document.getElementById('c');function f(){n++;c.textContent=n+' '+(document.getElementById('v').currentTime|0);requestAnimationFrame(f)}requestAnimationFrame(f);
let r=document.getElementById('rows');for(let i=0;i<300;i++){let d=document.createElement('div');d.className='r';d.style.background='hsl('+(i*7%360)+',50%,30%)';d.textContent='row '+i;r.appendChild(d)}
let dir=1;setInterval(()=>{window.scrollBy(0,dir*40);if(window.scrollY>20000)dir=-1;if(window.scrollY<=0)dir=1},100);
let v=document.getElementById('v'),rs=0;function rst(why){rs++;dump('RESTART '+rs+' '+why+'\n');v.src='v720.webm?r='+rs;v.play().catch(()=>{})}v.addEventListener('ended',()=>rst('ended'));v.addEventListener('error',()=>rst('error'));setInterval(()=>{if(v.duration&&v.currentTime>v.duration-0.3)rst('stall')},3000);v.play().catch(e=>dump('PLAYERR '+e+'\n'));
setInterval(()=>{let q=v.getVideoPlaybackQuality();dump('YT t='+(performance.now()/1000|0)+' ct='+v.currentTime.toFixed(1)+' frames='+q.totalVideoFrames+' dropped='+q.droppedVideoFrames+' raf='+n+'\n')},10000);
</script></body></html>
