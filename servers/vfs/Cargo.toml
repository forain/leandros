[package]
name = "vfs-server"
version.workspace = true
edition.workspace = true

[dependencies]
ipc        = { path = "../../ipc" }
sched      = { path = "../../sched" }
mm         = { path = "../../mm" }
xattr      = { path = "../xattr" }
# The PTY pool + line discipline. No cycle: tty-server depends only on
# ipc/sched/spin, never on the VFS.
tty-server = { path = "../tty" }
spin.workspace = true
