# PipeWire on LeandrOS (ports/pipewire). Installed as
# /usr/share/pipewire/pipewire.conf.d/50-leandros.conf.
#
# There is no ALSA ABI on LeandrOS: the only output is leandros-snd-sink, a
# PipeWire client that drives the graph from virtio-sound's queue depth
# (/dev/pipewire). PipeWire starts it, WirePlumber and pipewire-pulse (the
# PulseAudio protocol server, $XDG_RUNTIME_DIR/pulse/native, for libpulse
# clients such as Firefox) once its socket is up.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum       = 1024
    default.clock.min-quantum   = 256
    default.clock.max-quantum   = 2048
}

context.exec = [
    { path = "/usr/bin/wireplumber" args = "" }
    { path = "/usr/bin/leandros-snd-sink" args = "" }
    { path = "/usr/bin/pipewire-pulse" args = "" }
]
