# WirePlumber on LeandrOS (ports/pipewire). Installed as
# /usr/share/wireplumber/wireplumber.conf.d/50-leandros.conf.
#
# No hardware monitors: there is no /dev/snd (ALSA), no bluetooth and no
# /dev/video*. The audio sink is leandros-snd-sink, an Audio/Sink client node
# that the standard policy (default-nodes, linking, stream/node volume
# restore) handles like any virtual sink.
wireplumber.profiles = {
  main = {
    hardware.audio = disabled
    hardware.bluetooth = disabled
    hardware.video-capture = disabled
    # logind is absent (no systemd); reserve-device is ALSA-only.
    support.logind = disabled
    support.reserve-device = disabled
  }
}
