[package]
name = "leandros-installer"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace]

[dependencies]
futures = "0.3.32"
libc = "0.2"
serde_json = "1"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
default-features = false
features = ["a11y", "tokio", "winit"]

[features]
default = ["wgpu", "wayland"]
wgpu = ["libcosmic/wgpu"]
wayland = ["libcosmic/wayland"]
