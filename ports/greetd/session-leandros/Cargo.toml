# Deliberately its own workspace root: this crate is built by the greetd port
# against a musl std target, not by the repo-root workspace (kernel/servers) or
# by userland/ (no_std, leandros-libc). Without this it would be pulled into
# whichever workspace happens to contain it.
[workspace]

[package]
name = "session-leandros"
version = "0.1.0"
edition = "2021"
publish = false
description = "utmpx and cgroup session bookkeeping for greetd"

# An rlib on purpose, not a staticlib (a staticlib carries its own std copy).
[lib]
name = "session_leandros"
path = "src/lib.rs"

[dependencies]
libc = "0.2"
