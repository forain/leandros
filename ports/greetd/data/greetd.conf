# LeandrOS greetd configuration -> /etc/greetd/greetd.conf
#
# greetd reads /etc/greetd/greetd.conf first and /etc/greetd/config.toml second
# (greetd/src/config/mod.rs read_config). Despite the upstream ".toml" name the
# format is `inish`, not TOML.

[terminal]
# LeandrOS has no VT layer at all: no /dev/tty0, no VT_ACTIVATE / VT_WAITACTIVE
# / VT_GETSTATE / KDSETMODE, and libseat is a shim with no seatd behind it.
# "none" is the ONLY value that keeps greetd off the terminal path entirely —
# it selects TerminalMode::Stdin, and every terminal call in the daemon and the
# session worker is behind a match arm that Stdin skips. Any other value opens
# /dev/tty0 during startup and greetd exits before it ever binds its socket.
#
# The consequence of Stdin is that the greeter and the session inherit greetd's
# own stdin/stdout/stderr instead of a freshly opened tty. On LeandrOS that is
# the serial console, which is where we want their logs anyway.
vt = "none"

# Only consulted on the terminal path, but greetd parses it either way.
switch = false

[general]
# Runs the session as
#   sh -c '[ -f /etc/profile ] && . /etc/profile; [ -f $HOME/.profile ] && . $HOME/.profile; exec <cmd>'
# The session's environment is otherwise EXACTLY what greetd pushed through
# pam_putenv — greetd does not pass its own environment down — so /etc/profile
# is the hook that puts the COSMIC render environment in front of a command
# greetd did not choose. See ports/greetd/data/profile.
source_profile = true

[default_session]
# The greeter. cosmic-comp's kiosk mode is already the greeter-session
# lifecycle: it spawns this child after the compositor is up with
# session::get_env() injected (WAYLAND_DISPLAY), and exits with the child's
# status — which is exactly what greetd wants from a greeter, with no
# cosmic-session and no COSMIC_SESSION_SOCK handshake in the way.
#
# NOTE: replace the greeter half of this line with the privilege-dropping
# launcher when that lands. cosmic-comp must stay root (shim libseat, no seatd,
# unverified /dev/dri and /dev/input node modes); only the greeter client drops
# privileges, and it does so inside the launcher, not here.
#
# ARGUMENT ORDER IS LOAD-BEARING. cosmic-comp takes its kiosk child from
# env::args().skip(1).next() — the FIRST argument, whatever it is — while its
# flag parser scans every argument and ignores the ones it does not know. So
# `cosmic-comp --no-xwayland <exec>` spawns "--no-xwayland" and dies with
# ENOENT ("Error running kiosk child ... No such file or directory"), while
# `cosmic-comp <exec> --no-xwayland` both disables Xwayland and spawns <exec>.
# The flag is then also handed to cosmic-greeter, whose own argument loop
# ignores what it does not recognise. --no-xwayland is not optional: smithay's
# Xwayland-socket bind-error path leaks fds -> EMFILE -> a softpipe
# NULL-transfer crash at first scanout.
command = "/bin/cosmic-comp /bin/cosmic-greeter --no-xwayland"

# The user greetd runs the greeter session as. Upstream's default is an
# unprivileged "greeter" account; here the compositor is the greeter session, so
# it is root. greetd chowns its listening socket to this user's uid/gid.
user = "root"
