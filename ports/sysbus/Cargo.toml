[package]
name = "leandros-sysbus"
version = "0.1.0"
edition = "2021"
description = "Minimal org.freedesktop system services (login1, locale1, UPower) for LeandrOS"
license = "MIT"
publish = false

[[bin]]
name = "leandros-sysbus"
path = "src/main.rs"

[dependencies]
# zbus 5 (busd 0.5.0 uses the same major), tokio flavour only.
zbus = { version = "5.13", default-features = false, features = ["tokio"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "net", "io-util", "sync"] }
libc = "0.2"
serde = "1"
futures-util = { version = "0.3", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
