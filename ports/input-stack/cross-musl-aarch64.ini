# Template: copy to the workdir ($LEANDROS_WORK/<name>, default ~/.cache/leandros-work/<name>) with @D@ replaced by that workdir path.
[binaries]
c = ['@D@/toolchain/aarch64-linux-musl-cc']
cpp = ['@D@/toolchain/aarch64-linux-musl-c++']
ar = ['@D@/toolchain/aarch64-linux-musl-ar']
ranlib = ['@D@/toolchain/aarch64-linux-musl-ranlib']
strip = ['llvm-strip']
pkg-config = ['pkg-config']
c_ld = 'lld'
cpp_ld = 'lld'

[built-in options]
c_args = []
c_link_args = []
cpp_args = []
cpp_link_args = []

[properties]
sys_root = '@D@/sysroot/aarch64'
pkg_config_libdir = '@D@/sysroot/aarch64/usr/lib/pkgconfig'
needs_exe_wrapper = true

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
