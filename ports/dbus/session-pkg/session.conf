<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Minimal session bus configuration for busd 0.5.0 on LeandrOS.

  busd unconditionally reads a config file (default
  /usr/share/dbus-1/session.conf, see src/bin/busd.rs) even though most of
  the D-Bus spec's config surface (policy enforcement, <fork>, <user>,
  <servicehelper>) isn't implemented yet (busd is alpha — see AGENTS.md
  "Architecture"). So this file only contains elements busd's
  config/xml.rs actually parses and that make sense for us:

    - <type>session</type>   — sets $DBUS_STARTER_BUS_TYPE for activated
      clients.
    - <auth>EXTERNAL</auth>  — matches spec intent. NOTE: for a unix-socket
      listener busd's bus::Bus::for_address() hardcodes
      AuthMechanism::External regardless of this element (auth_mechanism is
      derived from the transport kind, not from Config::auth, which the
      broker doesn't currently thread through) — this line is documentation
      of intent, not load-bearing today.
    - <listen> — a default listen address. In practice
      dbus-run-session always passes an explicit `--address`, which takes
      precedence over this (see src/bin/busd.rs), so this value only
      matters if busd is invoked directly without -a/--address.
    - <servicedir>/usr/share/dbus-1/services</servicedir> — as of
      `ports/busd/start-service-activation.patch`, busd actually implements
      .service-file activation (real Exec= spawning,
      StartServiceByName/ListActivatableNames/UpdateActivationEnvironment,
      plus implicit activation on an unowned-but-activatable name — see
      that patch's header for the full design and its gating against
      re-introducing the hang service-unknown-reply.patch fixed). This
      directory is scanned once at busd startup (not re-scanned lazily);
      any .service file that should activate on this image's session bus
      needs to be installed here before busd starts. No .service files are
      shipped by this port itself — this just points busd at where other
      ports/packages should install theirs.

  Deliberately OMITTED:
    - <policy> — busd has no groups/users database story we can rely on
      (LeandrOS is single-user/root-only for this bring-up), and the task
      brief says ship no policy modules we don't have. Everything is
      allowed by default when no policy denies it.
    - <fork>, <pidfile>, <user>, <syslog>, <keep_umask> — daemonizing,
      privilege-dropping and syslog are not part of our LeandrOS session
      bring-up (busd is launched and supervised directly by
      dbus-run-session, foreground, as root). Note this also means a
      .service file's `User=` is parsed but not honoured (busd has no
      setuid-helper to drop privileges with); activated services always run
      as busd's own user.
-->
<busconfig>
  <type>session</type>
  <auth>EXTERNAL</auth>
  <listen>unix:path=/run/user/0/bus</listen>
  <servicedir>/usr/share/dbus-1/services</servicedir>
</busconfig>
