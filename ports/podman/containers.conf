# LeandrOS: netavark programs the net server's nf_tables store through vanilla nft
# (NETLINK_NETFILTER, design-podnat); the net server's datapath honours the ruleset
# (published ports, masquerade intent). Root keeps the bridge network.
# This file replaces the packaged /usr/share/containers/containers.conf, so its default_sysctls must be repeated:
# without NET_RAW (podman 5+ default) a container's busybox ping needs a ping socket, i.e. its netns's
# net.ipv4.ping_group_range to include gid 0.
[containers]
default_sysctls = ["net.ipv4.ping_group_range=0 0"]

[network]
firewall_driver = "nftables"
# Rootless default network is pasta, dual-stack: pasta copies the host's addresses and default
# routes into the container netns over rtnetlink. --no-map-gw lets a container reach the
# gateway address (the host's LAN side) instead of the host's loopback.
pasta_options = ["--no-map-gw"]
