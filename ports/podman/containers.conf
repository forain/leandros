# LeandrOS: netavark programs the net server's nf_tables store through vanilla nft
# (NETLINK_NETFILTER, design-podnat); the net server's datapath honours the ruleset
# (published ports, masquerade intent). Root keeps the bridge network.
[network]
firewall_driver = "nftables"
# Rootless default network is pasta. There is no IPv6 stack (pasta would fail on
# "Couldn't set IPv6 route(s)"), and --no-map-gw lets a container reach the
# gateway address (the host's LAN side) instead of the host's loopback.
pasta_options = ["-4", "--no-map-gw"]
