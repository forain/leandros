[binaries]
c = ['@DIRNAME@/toolchain/aarch64-linux-musl-cc']
cpp = ['@DIRNAME@/toolchain/aarch64-linux-musl-c++']
ar = ['@DIRNAME@/toolchain/aarch64-linux-musl-ar']
ranlib = ['@DIRNAME@/toolchain/aarch64-linux-musl-ranlib']
strip = ['zig', 'strip']
pkg-config = ['pkg-config']
c_ld = 'lld'
cpp_ld = 'lld'

[built-in options]
c_args = []
c_link_args = []
cpp_args = []
cpp_link_args = []

[properties]
sys_root = '@DIRNAME@/sysroot-aarch64'
pkg_config_libdir = '@DIRNAME@/sysroot-aarch64/usr/lib/pkgconfig'
needs_exe_wrapper = true

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
