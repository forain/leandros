[package]
name = "kernel"
version.workspace = true
edition.workspace = true

[[bin]]
name = "kernel"
path = "src/main.rs"

[features]
# Target Raspberry Pi 5 (BCM2712 + RP1).
# Propagates to arch-aarch64 (MMIO addresses) and drivers/f2fs-server
# (selects the sdhci SD-card driver as drivers::blkdev instead of virtio_blk).
rpi5 = ["arch-aarch64/rpi5", "drivers/rpi5", "f2fs-server/rpi5"]
# Target QEMU's -M raspi4b machine — testable stepping stone for the sdhci
# driver (see drivers/src/sdhci.rs). Not a hardware target.
raspi4b = ["arch-aarch64/raspi4b", "drivers/raspi4b", "f2fs-server/raspi4b"]

[dependencies]
mm         = { path = "../mm" }
sched      = { path = "../sched" }
elf        = { path = "../elf" }
ipc        = { path = "../ipc" }
boot       = { path = "../boot" }
drivers    = { path = "../drivers" }
vfs-server  = { path = "../servers/vfs" }
evdev-server = { path = "../servers/evdev" }
drm-server = { path = "../servers/drm" }
pipewire-server = { path = "../servers/pipewire" }
f2fs-server = { path = "../servers/f2fs" }
net-server  = { path = "../servers/net" }
tty-server  = { path = "../servers/tty" }
init-server = { path = "../servers/init" }
usb     = { path = "../drivers/usb" }
wifi    = { path = "../drivers/wifi" }
leandros-lib = { path = "../lib" }
limine = "0.6.3"
miniz_oxide = { version = "0.7", default-features = false, features = ["with-alloc"] }
bitflags.workspace = true
spin.workspace = true

[target.'cfg(target_arch = "x86_64")'.dependencies]
arch-x86_64 = { path = "../arch/x86_64" }

[target.'cfg(target_arch = "aarch64")'.dependencies]
arch-aarch64 = { path = "../arch/aarch64" }
