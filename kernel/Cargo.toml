[package]
name = "kernel"
version.workspace = true
edition.workspace = true

[[bin]]
name = "kernel"
path = "src/main.rs"

[features]
# Target Raspberry Pi 5 (BCM2712 + RP1).
# Propagates to arch-aarch64 (MMIO addresses) and drivers/f2fs-server
# (selects the sdhci SD-card driver as drivers::blkdev instead of virtio_blk).
rpi5 = ["arch-aarch64/rpi5", "drivers/rpi5", "f2fs-server/rpi5"]
# Target QEMU's -M raspi4b machine — testable stepping stone for the sdhci
# driver (see drivers/src/sdhci.rs). Not a hardware target.
raspi4b = ["arch-aarch64/raspi4b", "drivers/raspi4b", "f2fs-server/raspi4b"]
# Verbose xHCI tracing + boot-time USB mass-storage self-test.
usb-debug = ["drivers/usb-debug"]
# NVIDIA GPUs via NVIDIA's open-gpu-kernel-modules resource manager linked in
# (drivers/nvidia + libnvrm.a from ports/openrm/build.sh). x86_64 only; off by
# default, and the default kernel is byte-for-byte unaffected by it.
nvidia = ["dep:nvidia-rm"]
# GPU / display drivers (Kconfig I915, VIRTIO_GPU, V3D). Feature on == today's code.
drv-i915 = ["drivers/i915"]
mod-i915 = []
drv-virtio-gpu = ["drivers/virtio-gpu"]
drv-v3d = ["drivers/v3d", "drivers/v3d-core"]
mod-v3d = ["drivers/v3d-core"]
# Kconfig-gated network drivers (kmod L1a).
mod-usb-video-class = ["usb/uvc-module"]
mod-usb-hid = ["usb/hid-module", "drivers/usb-hid-module"]
drv-e1000e = ["drivers/e1000e"]
drv-r8169 = ["drivers/r8169"]
drv-macb = ["drivers/macb"]
mod-macb = []
drv-virtio-net = ["drivers/virtio-net"]
drv-wifi-stack = ["drivers/wifi-stack"]
drv-iwlwifi = ["drivers/iwlwifi"]
drv-wifi-sim = ["drivers/wifi-sim"]
drv-brcmf = ["drivers/brcmf"]
mod-brcmf = []
# kmod L1c misc driver gates.
drv-virtio-rng = ["drivers/drv-virtio-rng"]
drv-hda = ["drivers/drv-hda"]
drv-lapinv = ["drivers/drv-lapinv"]
drv-i2c-hid = ["drivers/drv-i2c-hid"]
# kmodW2: gates for drivers that become tristate in later lanes (declared now so
# every lane edits only its own driver). Y-only: the features do not gate code yet.
drv-nvme = ["drivers/drv-nvme"]
drv-sdhci = ["drivers/drv-sdhci"]
mod-sdhci = []
drv-virtio-blk = ["drivers/drv-virtio-blk"]
drv-virtio-keyboard = ["drivers/drv-virtio-keyboard"]
drv-usb-storage = ["drivers/drv-usb-storage"]
mod-usb-storage = ["usb/msc-module", "drivers/usb-storage-module"]
drv-usb-hid = []
drv-virtio-snd = ["drivers/virtio-snd"]
drv-bt = []
mod-bt = ["usb/bt-module"]
drv-hdmi-audio = ["drivers/hdmi-audio"]
mod-hdmi-audio = []

[dependencies]
mm         = { path = "../mm" }
kmod-abi   = { path = "../lib/kmod-abi" }
kmod-elf   = { path = "../lib/kmod-elf" }
sched      = { path = "../sched" }
elf        = { path = "../elf" }
ipc        = { path = "../ipc" }
boot       = { path = "../boot" }
drivers    = { path = "../drivers" }
vfs-server  = { path = "../servers/vfs" }
evdev-server = { path = "../servers/evdev" }
drm-server = { path = "../servers/drm" }
pipewire-server = { path = "../servers/pipewire" }
f2fs-server = { path = "../servers/f2fs" }
xattr       = { path = "../servers/xattr" }
net-server  = { path = "../servers/net" }
tty-server  = { path = "../servers/tty" }
usb     = { path = "../drivers/usb" }
wifi    = { path = "../drivers/wifi" }
leandros-lib = { path = "../lib" }
limine = "0.6.3"
miniz_oxide = { version = "0.7", default-features = false, features = ["with-alloc"] }
bitflags.workspace = true
spin.workspace = true

[target.'cfg(target_arch = "x86_64")'.dependencies]
arch-x86_64 = { path = "../arch/x86_64" }
nvidia-rm = { path = "../drivers/nvidia", optional = true }

[target.'cfg(target_arch = "aarch64")'.dependencies]
arch-aarch64 = { path = "../arch/aarch64" }
